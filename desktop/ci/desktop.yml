# Copy to .github/workflows/desktop.yml to enable. (The automation that wrote
# this cannot push workflow files, so it lives here until a maintainer moves it.)
name: desktop

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME schemas and tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            dconf-cli libglib2.0-bin gsettings-desktop-schemas \
            gnome-shell-common mutter-common gdm3 gnome-remote-desktop \
            desktop-file-utils shellcheck
      - name: Validate dconf tiers
        run: python3 desktop/tests/validate-dconf.py --schemas /usr/share/glib-2.0/schemas
      - name: Check default apps and browser policies
        run: python3 desktop/apps/tests/check-apps.py
      - name: Install into a temp root and verify locks with gsettings
        run: desktop/tests/test-install.sh
      - name: Workplace unit tests
        working-directory: desktop/workplace
        run: python3 -m unittest discover -s tests -v
      - name: Lint
        run: |
          desktop-file-validate desktop/workplace/data/*.desktop
          shellcheck -S warning desktop/install.sh desktop/apps/install-apps.sh desktop/workplace/install.sh desktop/tests/test-install.sh
          python3 -m py_compile desktop/workplace/workplace/*.py desktop/workplace/workplace/pages/*.py
