# Org branding. Installed to /etc/enterprise-linux/branding.conf and used to
# render the dconf templates (@KEY@) at install time. The IT app reads it too.
# Plain KEY=VALUE, no shell expansion, no quotes needed.

ORG_NAME=Example Corp
# Shown on the login screen before sign-in (acceptable-use notice).
LOGIN_BANNER=This device is managed by Example Corp. Use is subject to the acceptable use policy.
BRAND_COLOR=#1f3a5f
SUPPORT_URL=https://support.example.com
SUPPORT_EMAIL=it-support@example.com
