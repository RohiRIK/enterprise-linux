[workspace]
resolver = "2"
members = ["crates/eld-api", "crates/eld", "crates/elctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RohiRIK/enterprise-linux"
rust-version = "1.80"

# Keep this list short: every crate here ships on every managed device.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
