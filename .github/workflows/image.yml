# Builds the enterprise-linux installer ISO from the official Ubuntu 26.04
# desktop ISO, installs it unattended into a VM with Secure Boot (Microsoft
# keys, like a real laptop) and a software TPM, boots the installed disk and
# checks the first-boot report. See image/README.md.
name: image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: [image/**, packaging/**, security/**, desktop/**, catalog/**, crates/**, .github/workflows/image.yml]

permissions:
  contents: read

env:
  UBUNTU_ISO: ubuntu-26.04.1-desktop-amd64.iso
  UBUNTU_URL: https://releases.ubuntu.com/26.04
  # Ubuntu CD Image Automatic Signing Key (2012), signs SHA256SUMS.
  UBUNTU_CD_KEY: 843938DF228D22F7B3742BC0D94AA3F0EFE21092

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml shellcheck
      - name: Image unit tests
        run: python3 -m unittest discover -s image/tests -v
      - name: Shellcheck
        run: shellcheck -x image/build-iso.sh image/late/el-install-target image/uki/el-build-uki image/uki/zz-el-uki image/tests/el-ci-report packaging/deb/build-eld-deb.sh

  vm:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso qemu-system-x86 qemu-utils ovmf swtpm python3-yaml
      - name: Base ISO (cached)
        id: iso
        uses: actions/cache@v4
        with:
          path: iso/${{ env.UBUNTU_ISO }}
          key: ${{ env.UBUNTU_ISO }}
      - name: Download base ISO
        if: steps.iso.outputs.cache-hit != 'true'
        run: mkdir -p iso && curl -fsSL -o "iso/$UBUNTU_ISO" "$UBUNTU_URL/$UBUNTU_ISO"
      - name: Verify base ISO (signed SHA256SUMS)
        run: |
          curl -fsSL -o iso/SHA256SUMS "$UBUNTU_URL/SHA256SUMS"
          curl -fsSL -o iso/SHA256SUMS.gpg "$UBUNTU_URL/SHA256SUMS.gpg"
          export GNUPGHOME="$RUNNER_TEMP/gnupg" && mkdir -m 700 -p "$GNUPGHOME"
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$UBUNTU_CD_KEY"
          gpg --batch --status-fd 1 --verify iso/SHA256SUMS.gpg iso/SHA256SUMS \
            | grep -q "^\[GNUPG:\] VALIDSIG $UBUNTU_CD_KEY "
          (cd iso && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Build eld package
        run: packaging/deb/build-eld-deb.sh --out out
      - name: Build test ISO
        run: |
          image/build-iso.sh --base-iso "iso/$UBUNTU_ISO" --sha256sums iso/SHA256SUMS \
            --deb out/el-eld_*.deb --out out --unattended --test-identity --serial \
            --secrets-out "$RUNNER_TEMP/el-secrets"
      - name: Mask build secrets
        run: while IFS= read -r s; do [ -n "$s" ] && echo "::add-mask::$s"; done < "$RUNNER_TEMP/el-secrets"
      - name: Install and boot in a VM
        run: image/tests/vm-test.sh --iso out/enterprise-linux-*-ci.iso --work vm
      - name: Scrub secrets from logs
        if: always()
        run: |
          [ -r "$RUNNER_TEMP/el-secrets" ] || exit 0
          shopt -s nullglob
          python3 - "$RUNNER_TEMP/el-secrets" vm/*.log <<'PY'
          import sys
          secrets = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          for path in sys.argv[2:]:
              data = open(path, "rb").read()
              for s in secrets:
                  data = data.replace(s.encode(), b"[REDACTED]")
              open(path, "wb").write(data)
          PY
          # Check only what gets uploaded, never disk.qcow2, TPM or OVMF state.
          files=(vm/*.log)
          [ -f vm/screen.ppm ] && files+=(vm/screen.ppm)
          [ ${#files[@]} -eq 0 ] || ! grep -qaF -f "$RUNNER_TEMP/el-secrets" -- "${files[@]}"
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs
          path: vm/*.log
      # An image the text scrub cannot redact: CI-only secrets, fresh per run,
      # kept for one day.
      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-screen
          path: vm/screen.ppm
          retention-days: 1
          if-no-files-found: ignore
