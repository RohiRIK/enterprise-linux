# Unit tests and shellcheck for the image build helpers. The VM install
# proof (build the ISO, install it under Secure Boot + TPM, check the
# first-boot report) lands in its own PR. See image/README.md.
name: image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: [image/**, packaging/**, security/**, desktop/**, catalog/**, crates/**, .github/workflows/image.yml]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml shellcheck
      - name: Image unit tests
        run: python3 -m unittest discover -s image/tests -v
      - name: Shellcheck
        run: shellcheck -x image/build-iso.sh image/late/el-install-target image/uki/el-build-uki image/uki/zz-el-uki image/tests/el-ci-report packaging/deb/build-eld-deb.sh
