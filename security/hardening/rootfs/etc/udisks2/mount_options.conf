# enterprise-linux -- udisks2 mount options for removable media (layer 7/8)
# udisks2 >= 2.9 reads this file. Removable media is never executable and
# never honours setuid/device nodes, whatever the USBGuard storage policy is.
# Filesystem-specific built-in defaults (uid=, shortname=, ...) still apply.
[defaults]
defaults=nosuid,nodev,noexec
allow=exec,noexec,nodev,nosuid,atime,noatime,nodiratime,ro,rw,sync,dirsync,noload
