#!/usr/sbin/nft -f
# enterprise-linux -- /etc/nftables.conf (Debian/Ubuntu family, layer 9)
# Loaded by nftables.service. Replaces the distro sample (backed up by
# el-harden-apply as nftables.conf.el-orig). Does NOT "flush ruleset", so
# container/VM tooling tables survive a reload.
include "/etc/nftables/el-baseline.nft"
