# enterprise-linux hardening baseline -- kernel / network sysctls
# Layer 10 (kernel hardening) and layer 9 (network) of docs/HARDENING.md.
#
# Implementation guide oriented on CIS / DISA STIG via ComplianceAsCode.
# This is NOT a certification claim. Not yet tested on real hardware.
#
# "Ref:" = ComplianceAsCode (CaC) rule id; CaC maps it to the CIS / STIG
# item for the benchmark version you scan with. Where no CaC rule is known
# the line says "Ref: none (project choice)".
#
# A leading "-" means "ignore if the key does not exist on this kernel"
# (supported by systemd-sysctl and procps-ng sysctl --system). Used for keys
# that only exist on newer or distro-patched kernels.

# --- Kernel information leaks ------------------------------------------------

# Hide kernel pointers in /proc and elsewhere, even from root (2).
# Ref: sysctl_kernel_kptr_restrict
kernel.kptr_restrict = 2

# Only CAP_SYSLOG may read the kernel ring buffer.
# Ref: sysctl_kernel_dmesg_restrict
kernel.dmesg_restrict = 1

# perf_event_open: 3 = no unprivileged use (Debian/Ubuntu kernel patch);
# upstream / RHEL kernels treat values >2 as 2 (kernel profiling only for admins).
# Trade-off: breaks unprivileged `perf` for developers.
# Ref: sysctl_kernel_perf_event_paranoid
kernel.perf_event_paranoid = 3

# --- Attack surface: BPF, kexec, ptrace, userfaultfd ---------------------------

# Disable unprivileged eBPF. 1 = disabled and cannot be re-enabled until reboot.
# Ref: sysctl_kernel_unprivileged_bpf_disabled
kernel.unprivileged_bpf_disabled = 1

# Harden the BPF JIT for all users (constant blinding).
# Ref: sysctl_net_core_bpf_jit_harden
net.core.bpf_jit_harden = 2

# Disable kexec_load / kexec_file_load after boot (one-way switch).
# Trade-off: kdump (enabled by default on RHEL) loads its crash kernel via kexec
# AFTER systemd-sysctl runs, so kdump will fail to arm. Remove this key on
# systems that need kdump. Lockdown=integrity already restricts kexec to signed
# images, so this is defence in depth.
# Ref: sysctl_kernel_kexec_load_disabled
kernel.kexec_load_disabled = 1

# Yama: ptrace only of descendants (1). gdb/strace on own children still work;
# attaching to an unrelated running process needs CAP_SYS_PTRACE.
# 2 (admin-only) would break developer debugging and some EDR agents.
# Ref: sysctl_kernel_yama_ptrace_scope
kernel.yama.ptrace_scope = 1

# Only privileged users may create userfaultfd (exploit primitive).
# Ref: none (project choice; KSPP recommendation)
vm.unprivileged_userfaultfd = 0

# Full address space layout randomisation.
# Ref: sysctl_kernel_randomize_va_space
kernel.randomize_va_space = 2

# Disable the magic SysRq key (local console abuse).
# Trade-off: removes the "REISUB" emergency reboot on hung laptops.
# Ref: sysctl_kernel_sysrq
kernel.sysrq = 0

# Do not auto-load TTY line disciplines on unprivileged request.
# Ref: none (project choice; KSPP recommendation)
dev.tty.ldisc_autoload = 0

# Disallow TIOCSTI terminal input injection (kernel >= 6.2).
# Ref: none (project choice; KSPP recommendation)
-dev.tty.legacy_tiocsti = 0

# Ubuntu-only: restrict unprivileged user namespaces to AppArmor-allowed
# programs (Ubuntu 24.04 default, set explicitly so drift is detectable).
# We deliberately do NOT set user.max_user_namespaces=0: that breaks Flatpak,
# browser sandboxes and rootless Podman (layer 11 relies on them).
# Ref: none (project choice)
-kernel.apparmor_restrict_unprivileged_userns = 1

# io_uring: left at the kernel default. Setting 2 (disabled) removes a large
# attack surface but breaks newer QEMU, some databases and developer tooling.
# Revisit per profile.
# -kernel.io_uring_disabled = 2

# --- Filesystem protections ----------------------------------------------------

# Ref: sysctl_fs_protected_hardlinks
fs.protected_hardlinks = 1
# Ref: sysctl_fs_protected_symlinks
fs.protected_symlinks = 1
# Restrict O_CREAT on FIFOs / regular files in world-writable sticky dirs.
# Ref: none (project choice; KSPP recommendation)
fs.protected_fifos = 2
fs.protected_regular = 2

# No core dumps from setuid programs (see also systemd/coredump.conf.d).
# Ref: sysctl_fs_suid_dumpable
fs.suid_dumpable = 0

# --- IPv4 network ----------------------------------------------------------------

# Not a router. Trade-off: rootful Docker/libvirt NAT needs forwarding; they
# usually re-enable it themselves at runtime (developer profile note).
# Ref: sysctl_net_ipv4_ip_forward
net.ipv4.ip_forward = 0

# Strict reverse path filtering (anti-spoofing).
# Trade-off: some multi-homed or VPN split setups need loose mode (2).
# Ref: sysctl_net_ipv4_conf_all_rp_filter
net.ipv4.conf.all.rp_filter = 1
# Ref: sysctl_net_ipv4_conf_default_rp_filter
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects.
# Ref: sysctl_net_ipv4_conf_all_accept_redirects
net.ipv4.conf.all.accept_redirects = 0
# Ref: sysctl_net_ipv4_conf_default_accept_redirects
net.ipv4.conf.default.accept_redirects = 0
# Ref: sysctl_net_ipv4_conf_all_secure_redirects
net.ipv4.conf.all.secure_redirects = 0
# Ref: sysctl_net_ipv4_conf_default_secure_redirects
net.ipv4.conf.default.secure_redirects = 0

# Never send redirects (not a router).
# Ref: sysctl_net_ipv4_conf_all_send_redirects
net.ipv4.conf.all.send_redirects = 0
# Ref: sysctl_net_ipv4_conf_default_send_redirects
net.ipv4.conf.default.send_redirects = 0

# Drop source-routed packets.
# Ref: sysctl_net_ipv4_conf_all_accept_source_route
net.ipv4.conf.all.accept_source_route = 0
# Ref: sysctl_net_ipv4_conf_default_accept_source_route
net.ipv4.conf.default.accept_source_route = 0

# Log packets with impossible addresses. Trade-off: can be noisy on some Wi-Fi.
# Ref: sysctl_net_ipv4_conf_all_log_martians
net.ipv4.conf.all.log_martians = 1
# Ref: sysctl_net_ipv4_conf_default_log_martians
net.ipv4.conf.default.log_martians = 1

# Ref: sysctl_net_ipv4_icmp_echo_ignore_broadcasts
net.ipv4.icmp_echo_ignore_broadcasts = 1
# Ref: sysctl_net_ipv4_icmp_ignore_bogus_error_responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# SYN flood protection.
# Ref: sysctl_net_ipv4_tcp_syncookies
net.ipv4.tcp_syncookies = 1

# Protect against TIME-WAIT assassination (RFC 1337).
# Ref: none (project choice)
net.ipv4.tcp_rfc1337 = 1

# --- IPv6 network (laptop defaults) ----------------------------------------------

# Kernel-level router advertisements off. Laptops still get SLAAC addresses:
# NetworkManager (and systemd-networkd) process RAs in user space and set
# accept_ra=0 on the links they manage anyway. If you run an unmanaged
# interface that relies on kernel RA processing, override per interface.
# Ref: sysctl_net_ipv6_conf_all_accept_ra
net.ipv6.conf.all.accept_ra = 0
# Ref: sysctl_net_ipv6_conf_default_accept_ra
net.ipv6.conf.default.accept_ra = 0

# Ref: sysctl_net_ipv6_conf_all_accept_redirects
net.ipv6.conf.all.accept_redirects = 0
# Ref: sysctl_net_ipv6_conf_default_accept_redirects
net.ipv6.conf.default.accept_redirects = 0

# Ref: sysctl_net_ipv6_conf_all_accept_source_route
net.ipv6.conf.all.accept_source_route = 0
# Ref: sysctl_net_ipv6_conf_default_accept_source_route
net.ipv6.conf.default.accept_source_route = 0

# Not a router.
# Ref: sysctl_net_ipv6_conf_all_forwarding
net.ipv6.conf.all.forwarding = 0

# Prefer temporary (privacy) addresses on roaming laptops (RFC 8981).
# Ref: none (project choice)
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
