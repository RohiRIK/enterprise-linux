# enterprise-linux -- name-resolution hardening (layer 9)
# No mDNS / LLMNR announcements or resolution by default: both leak the host
# name and are classic credential-relay vectors on untrusted networks.
# A policy can enable mDNS per trusted connection (connection.mdns=2).
# Trade-off: printer / Chromecast discovery stops working on home networks.
[connection]
connection.mdns=0
connection.llmnr=0
