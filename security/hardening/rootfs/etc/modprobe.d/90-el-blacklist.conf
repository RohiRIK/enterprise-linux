# enterprise-linux hardening baseline -- unused filesystems and protocols
# Layer 10 (kernel hardening) of docs/HARDENING.md. Implementation guide,
# not a certification claim. Not yet tested on real hardware.
#
# "install <mod> /bin/false" stops explicit and automatic loading (including
# as a dependency); "blacklist <mod>" stops alias-based autoloading. Both are
# used, as CIS / STIG content expects. Root can still bypass with insmod;
# module signing + lockdown (layer 1) is the real control there.
#
# Deliberately NOT blacklisted (trade-offs):
#   squashfs    - snaps (Ubuntu) and many live/installer images need it
#   usb-storage - removable media is governed by USBGuard policy (layer 8:
#                 block | read-only | allow), not by the module list
#   thunderbolt - docks need it; device authorization is done by bolt with
#                 firmware security level "user approval"
#   bluetooth   - headsets/mice; class allowlist via BlueZ config instead
#   cifs / nfs  - corporate file shares
#   vfat/exfat  - USB sticks and the EFI system partition

# --- Rare / legacy filesystems ------------------------------------------------
# Ref: kernel_module_cramfs_disabled
install cramfs /bin/false
blacklist cramfs
# Ref: kernel_module_freevxfs_disabled
install freevxfs /bin/false
blacklist freevxfs
# Trade-off: users cannot mount Mac-formatted (HFS/HFS+) disks.
# Ref: kernel_module_hfs_disabled
install hfs /bin/false
blacklist hfs
# Ref: kernel_module_hfsplus_disabled
install hfsplus /bin/false
blacklist hfsplus
# Ref: kernel_module_jffs2_disabled
install jffs2 /bin/false
blacklist jffs2
# UDF: CIS L2 lists it, but it is used by DVD/Blu-ray media and some
# cross-platform USB sticks. Left loadable by default; uncomment for L2.
# Ref: kernel_module_udf_disabled
#install udf /bin/false
#blacklist udf
# In-kernel SMB *server*; we are a client only.
install ksmbd /bin/false
blacklist ksmbd

# --- Rare network protocols ---------------------------------------------------
# Ref: kernel_module_dccp_disabled
install dccp /bin/false
blacklist dccp
# Ref: kernel_module_sctp_disabled
install sctp /bin/false
blacklist sctp
# Ref: kernel_module_rds_disabled
install rds /bin/false
blacklist rds
# Ref: kernel_module_tipc_disabled
install tipc /bin/false
blacklist tipc
# Legacy / amateur-radio / obsolete protocols (KSPP, project choice)
install n-hdlc /bin/false
blacklist n-hdlc
install ax25 /bin/false
blacklist ax25
install netrom /bin/false
blacklist netrom
install x25 /bin/false
blacklist x25
install rose /bin/false
blacklist rose
install decnet /bin/false
blacklist decnet
install econet /bin/false
blacklist econet
install af_802154 /bin/false
blacklist af_802154
install ipx /bin/false
blacklist ipx
install appletalk /bin/false
blacklist appletalk
install psnap /bin/false
blacklist psnap
install p8022 /bin/false
blacklist p8022
install atm /bin/false
blacklist atm
# CAN bus: automotive developers need it; blocked for the workstation default.
install can /bin/false
blacklist can

# --- DMA-capable legacy buses -------------------------------------------------
# FireWire allows DMA attacks and is absent from current laptops.
# Ref: none (project choice; STIG-adjacent)
install firewire-core /bin/false
blacklist firewire-core
install firewire-ohci /bin/false
blacklist firewire-ohci
install firewire-sbp2 /bin/false
blacklist firewire-sbp2

# --- Test / debug drivers with a CVE history ----------------------------------
install vivid /bin/false
blacklist vivid
