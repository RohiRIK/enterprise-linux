# enterprise-linux -- password quality for LOCAL accounts (layer 5/16)
# Directory accounts (Entra/AD) are governed by the IdP. Local accounts are
# break-glass / bootstrap only. Requires pam_pwquality in the PAM stack
# (RHEL: default via authselect; Ubuntu: package libpam-pwquality).
# Ref: accounts_password_pam_minlen, _minclass, _dictcheck, _maxrepeat, _enforce_root
minlen = 14
minclass = 4
maxrepeat = 3
maxsequence = 3
dictcheck = 1
usercheck = 1
difok = 4
enforce_for_root
retry = 3
