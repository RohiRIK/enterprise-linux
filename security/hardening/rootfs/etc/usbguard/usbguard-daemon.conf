# enterprise-linux -- USBGuard daemon configuration (layer 8)
# Installed with mode 0600 (usbguard-daemon refuses group/world readable files).
# Rules: /etc/usbguard/rules.d/50-el-baseline.conf is GENERATED by
# bin/el-usbguard-rules from data/usbguard-rules.template according to the
# removable-media policy (block | read-only | allow). Not hardware-tested.

# Main rule file (rules appended via IPC, e.g. "allow this dock", land here)
RuleFile=/etc/usbguard/rules.conf
# Baseline + policy-rendered rules
RuleFolder=/etc/usbguard/rules.d/

# Anything that matches no rule is blocked (device stays connected but
# unauthorized, so it can be allowed later without re-plugging).
ImplicitPolicyTarget=block

# Devices present at daemon start and devices inserted later are both
# evaluated against the rules. HID and hubs are allowed by the baseline, so
# the built-in keyboard/touchpad keep working.
PresentDevicePolicy=apply-policy
PresentControllerPolicy=keep
InsertedDevicePolicy=apply-policy

# Kernel default for newly connected devices before usbguard decides.
# "internal" keeps internal (non-removable) ports authorized during early boot.
AuthorizedDefault=internal

RestoreControllerDeviceState=false
DeviceManagerBackend=uevent

# Only root (eld runs as root) may talk to the daemon over IPC; users get
# approval prompts through eld/polkit, not by direct IPC membership.
IPCAllowedUsers=root
IPCAllowedGroups=
IPCAccessControlFiles=/etc/usbguard/IPCAccessControl.d/

DeviceRulesWithPort=false

# Decisions go to the Linux audit log (el SIEM pipeline).
AuditBackend=LinuxAudit
AuditFilePath=/var/log/usbguard/usbguard-audit.log

HidePII=false
