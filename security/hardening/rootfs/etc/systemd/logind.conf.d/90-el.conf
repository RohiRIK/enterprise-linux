# enterprise-linux -- session behaviour (layer 16)
# Locking itself is done by the desktop (dconf keys below); logind makes sure
# a closed lid suspends (and so triggers lock-on-suspend) even when docked
# policy is not set.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
# Optional idle logout is a policy setting (session.idle_logout); default off.
#IdleAction=lock
#IdleActionSec=15min
