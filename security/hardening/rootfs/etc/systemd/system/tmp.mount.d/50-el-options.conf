# enterprise-linux -- /tmp mount options (layer 7). Applies to the distro
# tmp.mount (Fedora/RHEL, Ubuntu 25.10+) and to a tmp.mount generated from
# /etc/fstab, so the options are the same whichever creates /tmp.
# Trade-off: noexec /tmp breaks some installers and build tools that unpack
# and run helpers from /tmp; set TMPDIR to a per-user exec-allowed dir in the
# developer profile if needed.
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,noexec,size=50%%,nr_inodes=1m
