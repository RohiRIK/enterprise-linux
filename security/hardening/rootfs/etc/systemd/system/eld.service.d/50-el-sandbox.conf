# enterprise-linux -- systemd sandboxing for eld (layer 11)
# eld is a privileged control daemon (it renders sudo/polkit/usbguard config
# and drives cryptsetup), so it cannot use the strictest template in
# data/systemd-service-hardening.conf as-is. Everything it does not need is
# still removed. Harmless while eld.service does not exist yet.
# Check with: systemd-analyze security eld.service
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
# Writable paths eld owns or renders into (match the AppArmor/SELinux policy)
ReadWritePaths=/etc/el /var/lib/el /etc/sudoers.d /etc/polkit-1/rules.d /etc/usbguard/rules.d /etc/dconf/db/local.d
RuntimeDirectory=eld
RuntimeDirectoryMode=0755
StateDirectory=el
ConfigurationDirectory=el
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# No network listener (CONTROL-API.md §2): unix sockets + netlink (audit) only
RestrictAddressFamilies=AF_UNIX AF_NETLINK
IPAddressDeny=any
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@obsolete @cpu-emulation @debug @mount @swap @reboot @raw-io
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_READ_SEARCH CAP_FOWNER CAP_SETUID CAP_SETGID CAP_KILL CAP_AUDIT_WRITE CAP_SYS_PTRACE CAP_SYS_ADMIN CAP_IPC_LOCK CAP_NET_ADMIN
# CAP_SYS_ADMIN/IPC_LOCK: cryptsetup child; CAP_NET_ADMIN: nft child.
# Block devices for cryptsetup and the TPM for enrolment:
DevicePolicy=closed
DeviceAllow=block-blkext rw
DeviceAllow=block-device-mapper rw
DeviceAllow=block-sd rw
DeviceAllow=block-virtblk rw
DeviceAllow=/dev/tpmrm0 rw
DeviceAllow=/dev/mapper/control rw
UMask=0077
