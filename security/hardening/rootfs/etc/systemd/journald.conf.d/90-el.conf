# enterprise-linux -- journald (layer 13)
[Journal]
# Keep logs across reboots (incident response needs them).
Storage=persistent
Compress=yes
# Forward-secure sealing. Only effective once a sealing key exists
# (journalctl --setup-keys). The verification key must be escrowed off the
# device (Control API audit.* / SIEM), so el-harden-apply does NOT generate
# it automatically; it records a pending item instead.
Seal=yes
# SIEM forwarding is a POLICY choice (audit.forwarding in the Control API):
# set ForwardToSyslog=yes when rsyslog/syslog-ng forwards to the SIEM; keep
# "no" when the EDR/SIEM agent reads the journal directly.
ForwardToSyslog=no
SystemMaxUse=2G
MaxRetentionSec=90day
