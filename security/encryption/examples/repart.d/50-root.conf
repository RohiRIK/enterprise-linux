# systemd-repart: create (or grow) the root partition encrypted at first boot,
# bound to the TPM2 of the machine it boots on. Image pipeline ships the
# root as an unencrypted, minimal partition or creates it on first boot;
# see the README "Image pipeline / first boot" section.
[Partition]
Type=root
Format=btrfs
Encrypt=tpm2
# Bind to Secure Boot state (PCR 7). With a UKI signed by our key, also add
# the signed PCR 11 policy (systemd >= 252):
#   systemd-repart --tpm2-pcrs=7 --tpm2-public-key=/etc/systemd/tpm2-pcr-public-key.pem \
#                  --tpm2-public-key-pcrs=11
# Encrypt=key-file+tpm2 additionally enrolls a key file passed with --key-file=
# (useful as the initial credential for el-recovery-escrow).
SizeMinBytes=16G
Label=root
FactoryReset=yes
